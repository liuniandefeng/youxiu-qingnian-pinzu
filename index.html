<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优秀青年 · 奖状拼豆图纸</title>
<style>
  :root{
    --red:#b32126; --red-deep:#8c1218; --gold:#c9a227; --gold-soft:#e2d3ae;
    --ink:#3a2a1c; --ink-soft:#6b5a3e; --paper:#fffdf6; --muted:#8a7a5c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:#f3ead8;
    background-image:radial-gradient(rgba(150,110,40,.08) 1px, transparent 1.2px);
    background-size:22px 22px;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:30px 20px 10px;}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:22px;}
  .seal{
    width:54px;height:54px;flex:none;border-radius:10px;
    background:linear-gradient(145deg,#c22b2f,#8c1218);
    color:#fff;font-family:"STZhongsong","STSong","SimSun",serif;
    display:grid;place-items:center;text-align:center;
    font-size:13px;line-height:1.35;letter-spacing:2px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.28), 0 4px 10px rgba(140,18,24,.35);
    transform:rotate(-4deg);
  }
  .title-box h1{
    font-family:"STZhongsong","STSong","SimSun",serif;
    font-size:27px;letter-spacing:7px;color:var(--red-deep);
  }
  .title-box p{font-size:12.5px;color:var(--muted);letter-spacing:1.5px;margin-top:6px;}

  /* ---------- 主布局 ---------- */
  main{display:flex;gap:20px;align-items:flex-start;}
  .board{flex:1;min-width:0;}
  .canvas-card{
    position:relative;
    background:#fbf7ec;border-radius:8px;padding:20px;
    box-shadow:0 0 0 1px var(--gold-soft), 0 0 0 5px #fff, 0 0 0 6px #dcbd6b, 0 16px 36px rgba(90,60,20,.14);
    display:flex;justify-content:center;
  }
  canvas{display:block;border-radius:4px;cursor:crosshair;}
  #tip{
    position:absolute;display:none;pointer-events:none;z-index:5;
    background:#2e241a;color:#fff;font-size:12px;padding:4px 9px;border-radius:6px;
    white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);letter-spacing:1px;
  }
  .statusbar{
    display:flex;justify-content:space-between;gap:12px;
    font-size:12.5px;color:var(--muted);margin-top:14px;padding:0 4px;letter-spacing:1px;
  }
  .statusbar b{color:var(--red);font-weight:600;}

  /* ---------- 右侧面板 ---------- */
  .panel{width:330px;flex:none;display:flex;flex-direction:column;gap:16px;}
  .card{
    background:var(--paper);border:1px solid #eadfbc;border-radius:12px;
    padding:16px 18px 18px;box-shadow:0 6px 18px rgba(90,60,20,.08);
  }
  .card h2{
    font-size:14px;color:var(--red-deep);letter-spacing:4px;font-weight:700;
    display:flex;align-items:center;gap:9px;
    padding-bottom:12px;margin-bottom:4px;
    border-bottom:1px solid #f0e6cd;
  }
  .card h2::before{content:"";width:4px;height:15px;background:var(--red);border-radius:2px;}

  /* 每个设置项独立成块，用虚线分隔，避免文字挤在一起 */
  .field{padding:13px 0 0;}
  .field + .field{border-top:1px dashed #eee2c8;margin-top:13px;}
  .field > label{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:13px;color:var(--ink-soft);letter-spacing:1.5px;margin-bottom:9px;font-weight:600;
  }
  .field > label .hint{font-size:11.5px;color:#b3a480;font-weight:400;letter-spacing:1px;}

  #nameIn{
    width:100%;padding:9px 12px;font-size:15px;letter-spacing:4px;
    border:1px solid #d8c9a4;border-radius:7px;background:#fff;color:var(--ink);
    font-family:"Consolas","Courier New",monospace;font-weight:700;
  }
  #nameIn:focus{outline:2px solid rgba(179,33,38,.22);border-color:var(--red);}

  .seg{display:flex;border:1px solid #d8c9a4;border-radius:8px;overflow:hidden;background:#fff;}
  .seg button{
    flex:1;padding:9px 0;border:none;background:transparent;cursor:pointer;
    font-size:13px;letter-spacing:2px;color:var(--ink-soft);transition:.15s;
  }
  .seg button.on{background:var(--red);color:#fff;font-weight:600;}
  .seg button + button{border-left:1px solid #d8c9a4;}

  .chk{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    font-size:13px;color:var(--ink-soft);letter-spacing:1.5px;font-weight:600;
  }
  .chk input{width:15px;height:15px;accent-color:var(--red);}
  .chk .sub{font-size:11.5px;color:#b3a480;font-weight:400;}

  .size-row{display:flex;align-items:center;gap:10px;}
  .size-row input[type=range]{flex:1;accent-color:var(--red);}
  #sBadge{
    flex:none;min-width:46px;text-align:center;font-size:12.5px;font-weight:700;
    color:var(--red-deep);background:#f8ecd2;border:1px solid #e8d7a8;border-radius:6px;padding:3px 0;
    font-variant-numeric:tabular-nums;letter-spacing:0;
  }
  .mini{
    flex:none;border:1px solid #d8c9a4;background:#fff;color:var(--ink-soft);border-radius:6px;
    font-size:12px;padding:5px 10px;cursor:pointer;letter-spacing:1px;
  }
  .mini:hover{border-color:var(--red);color:var(--red);}

  #saveBtn{
    width:100%;padding:10px 0;border:none;border-radius:8px;cursor:pointer;
    background:var(--red);color:#fff;font-size:14px;letter-spacing:6px;font-weight:700;
    transition:.15s;box-shadow:0 4px 10px rgba(179,33,38,.28);
  }
  #saveBtn:hover{background:#991a1f;}

  /* ---------- 配色用量清单 ---------- */
  .lg{
    display:grid;grid-template-columns:22px 56px 1fr 76px;gap:10px;align-items:center;
    padding:8px 6px;border-radius:7px;cursor:pointer;transition:.12s;
  }
  .lg:hover{background:#fdf3e3;}
  .lg.on{background:#fdecec;box-shadow:inset 0 0 0 1px #e8a7a7;}
  .dot{
    width:18px;height:18px;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,.20) 0 2.5px, transparent 3.2px),
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.55) 0 18%, transparent 46%),
      var(--c);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.15);
  }
  .nm{font-size:13.5px;letter-spacing:2px;color:var(--ink);}
  .bar{height:6px;background:#efe6cf;border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--c);opacity:.85;border-radius:3px;}
  .ct{font-size:13px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;}
  .ct b{font-weight:700;color:var(--ink);}
  .lg-total{
    margin-top:10px;padding-top:11px;border-top:1px dashed #e2d3ae;
    font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;
    letter-spacing:2px;font-weight:600;
  }

  footer{
    text-align:center;font-size:12px;color:var(--muted);line-height:2.1;
    margin:26px 0 40px;letter-spacing:1px;
  }

  @media (max-width:1020px){
    main{flex-direction:column;}
    .panel{width:100%;flex-direction:row;flex-wrap:wrap;}
    .panel .card{flex:1;min-width:280px;}
    .title-box h1{font-size:22px;letter-spacing:4px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">拼豆<br>图纸</div>
    <div class="title-box">
      <h1>优秀青年 · 奖状</h1>
      <p>90 × 58 颗 · 5 色配色 · 5mm 珠约 45 × 29 cm</p>
    </div>
  </header>

  <main>
    <section class="board">
      <div class="canvas-card" id="card">
        <canvas id="cv"></canvas>
        <div id="tip"></div>
      </div>
      <div class="statusbar">
        <span id="hoverInfo">移动鼠标查看珠子坐标与颜色</span>
        <span id="selInfo"></span>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <h2>拼搭设置</h2>
        <div class="field">
          <label>定制姓名缩写<span class="hint">拼在右下角，留空则不拼</span></label>
          <input id="nameIn" maxlength="6" value="LT" spellcheck="false">
        </div>
        <div class="field">
          <label>显示模式</label>
          <div class="seg">
            <button data-m="bead" class="on">圆珠模式</button>
            <button data-m="pixel">图纸模式</button>
          </div>
        </div>
        <div class="field">
          <label class="chk">
            <input type="checkbox" id="gridChk" checked>
            显示网格线<span class="sub">（仅图纸模式生效）</span>
          </label>
        </div>
        <div class="field">
          <label>珠子大小<span class="hint">点击右侧可一键适应窗口</span></label>
          <div class="size-row">
            <input type="range" id="sRange" min="5" max="16" step="1">
            <span id="sBadge">10 px</span>
            <button class="mini" id="fitBtn">适应窗口</button>
          </div>
        </div>
        <div class="field">
          <button id="saveBtn">保存图纸 PNG</button>
        </div>
      </div>

      <div class="card">
        <h2>配色用量清单</h2>
        <div id="legend"></div>
        <div class="lg-total"><span>合计</span><span id="totalCt"></span></div>
      </div>
    </aside>
  </main>

  <footer>
    小贴士：建议使用 5mm 中孔珠 + 透明大板拼接 · 白珠用量最大，建议多备 15% ·
    熨斗中温（约 150℃）垫熨烫纸熨烫 15~20 秒 · 图纸可保存 PNG 后打印拼搭
  </footer>
</div>

<script>
/* ================= 基础数据 ================= */
const W = 90, H = 58;
const COLORS = {
  W : { hex:'#ffffff', name:'白色' },
  R : { hex:'#d62526', name:'大红' },
  DR: { hex:'#8c1218', name:'深红' },
  Y : { hex:'#f9c518', name:'明黄' },
  G : { hex:'#1d8a3e', name:'草绿' }
};
let grid = [];
let initials = 'LT';

/* ================= 图纸生成 ================= */
// 1:1 还原照片：红黄绿证书边框 + 顶部绶带奖牌 + 流苏 + 灯笼 + 玫瑰 + 文字
function buildGrid(){
  grid = Array.from({length:H}, () => Array(W).fill('W'));
  const P = (x,y,k) => { if(x>=0 && x<W && y>=0 && y<H) grid[y][x] = k; };
  const rect = (x,y,w,h,k) => { for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) P(i,j,k); };
  const f = i => (Math.floor(i/3) % 2 ? 'G' : 'Y');   // 黄绿 3 珠块交替

  /* ---- 三段式边框：红外边 2 + 黄绿块带 2 + 红细线 1 ---- */
  for(let x=0;x<W;x++){ P(x,0,'R'); P(x,1,'R'); P(x,H-1,'R'); P(x,H-2,'R'); }
  for(let y=0;y<H;y++){ P(0,y,'R'); P(1,y,'R'); P(W-1,y,'R'); P(W-2,y,'R'); }
  for(let y=2;y<=H-3;y++) [2,3,W-4,W-3].forEach(cx => P(cx,y,f(y)));
  for(let x=2;x<=W-3;x++) [2,3,H-4,H-3].forEach(cy => P(x,cy,f(x)));
  for(let x=4;x<=W-5;x++){ P(x,4,'R'); P(x,H-5,'R'); }
  for(let y=4;y<=H-5;y++){ P(4,y,'R'); P(W-5,y,'R'); }

  /* ---- 顶部红绶带（燕尾翼）---- */
  for(let x=8;x<=81;x++){
    const dx = Math.abs(x - 44.5);
    const ybot = dx < 12 ? 6 : dx < 20 ? 5 : 4;   // 中间厚、翼尖薄
    for(let y=0;y<=ybot;y++) P(x,y,'R');
  }
  [[8,1],[81,-1]].forEach(([x0,sgn]) => {         // 翼尖燕尾剪口，露回黄绿带
    P(x0,2,f(x0)); P(x0,3,f(x0)); P(x0+sgn,3,f(x0+sgn));
  });

  /* ---- 中央奖牌：红圈 + 黄底 + 红星 ---- */
  const mcx = 44.5, mcy = 3.6, mr = 5.1;
  for(let y=0;y<=9;y++) for(let x=39;x<=50;x++){
    const d = Math.hypot(x-mcx, y-mcy);
    if(d <= mr) P(x, y, d <= 3.9 ? 'Y' : 'R');
  }
  const star = ['...X...','..XXX..','XXXXXXX','.XXXXX.','..XXX..','.XX.XX.'];
  star.forEach((row,i) => [...row].forEach((ch,j) => { if(ch==='X') P(41+j, 1+i, 'R'); }));
  rect(40,8,10,2,'R');                            // 奖牌下的蝴蝶结带
  [40,41,42,43,46,47,48,49].forEach(x => P(x,10,'R'));

  /* ---- 两侧垂穗（吊绳 + 菱形坠）---- */
  [13,76].forEach(tx => {
    for(let y=5;y<=10;y++) P(tx,y,'R');
    P(tx-1,11,'R'); P(tx,11,'R'); P(tx+1,11,'R');
    P(tx-1,12,'R'); P(tx,12,'DR'); P(tx+1,12,'R');
    P(tx,13,'R');
  });

  /* ---- 底部两角灯笼 ---- */
  const lantern = (cx,cy) => {
    for(let y=-5;y<=5;y++) for(let x=-5;x<=5;x++){
      const d = Math.hypot(x/4.2, y/3.6);
      if(d <= 1) P(cx+x, cy+y, d > 0.8 ? 'DR' : 'R');
    }
    rect(cx-1,cy-4,3,1,'DR');                     // 上下灯盖
    rect(cx-1,cy+4,3,1,'DR');
    P(cx,cy+5,'Y'); P(cx,cy+6,'Y');               // 黄色小穗
  };
  lantern(11,51); lantern(78,51);

  /* ---- 底部双玫瑰 + 小花苞（螺旋暗纹）---- */
  const rose = (cx,cy,r) => {
    for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)
    for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){
      const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
      if(d > r) continue;
      const a = Math.atan2(dy,dx);
      P(x, y, (d < 1.4 || (d > 1.8 && Math.sin(2*a + d*2.1) > 0.42)) ? 'DR' : 'R');
    }
  };
  rose(39.5,51.5,4.7); rose(50.5,51.5,4.7); rose(45,48.8,2.7);

  /* ---- 文字（画布采样成珠）---- */
  const song = '"STZhongsong","STSong","SimSun","Songti SC",serif';
  drawTextGrid('奖状', 26, 9, 38, 12, 10, song, 11, 'R');
  drawTextGrid('优秀青年', 10, 21, 70, 19, 15, song, 2, 'R');
  if(initials) drawTextGrid(initials, 54, 39, 28, 9, 7, '"Consolas","Courier New",monospace', 1, 'R');
}

// 把文字以 4 倍超采样画到离屏画布，再按覆盖率落珠
function drawTextGrid(str, rx, ry, rw, rh, fontPx, family, spacing, color){
  const S = 4;
  const oc = document.createElement('canvas');
  oc.width = rw*S; oc.height = rh*S;
  const c = oc.getContext('2d', { willReadFrequently:true });
  c.fillStyle = '#000'; c.strokeStyle = '#000';
  c.font = '900 ' + fontPx*S + 'px ' + family;
  c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.miterLimit = 2;
  c.lineWidth = Math.max(2, fontPx*S*0.09);       // 描边加粗，贴近照片粗宋体
  const chars = [...str];
  const ws = chars.map(ch => c.measureText(ch).width);
  const total = ws.reduce((a,b)=>a+b,0) + spacing*S*(chars.length-1);
  let x = (oc.width - total)/2;
  chars.forEach((ch,i) => {
    c.strokeText(ch, x, oc.height/2);
    c.fillText(ch, x, oc.height/2);
    x += ws[i] + spacing*S;
  });
  const data = c.getImageData(0,0,oc.width,oc.height).data;
  for(let gy=0;gy<rh;gy++) for(let gx=0;gx<rw;gx++){
    let sum = 0;
    for(let sy=0;sy<S;sy++) for(let sx=0;sx<S;sx++)
      sum += data[(((gy*S+sy)*oc.width) + (gx*S+sx))*4 + 3];
    if(sum/(S*S) > 105) grid[ry+gy][rx+gx] = color;
  }
}

/* ================= 渲染 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const card = document.getElementById('card');
const hoverInfo = document.getElementById('hoverInfo');
const selInfo = document.getElementById('selInfo');
const legend = document.getElementById('legend');
const totalCt = document.getElementById('totalCt');
const nameIn = document.getElementById('nameIn');
const sRange = document.getElementById('sRange');
const sBadge = document.getElementById('sBadge');
const sVal = document.getElementById('sBadge');
const gridChk = document.getElementById('gridChk');
const saveBtn = document.getElementById('saveBtn');
let s = 10, manualSize = false, mode = 'bead', sel = null, hover = null;

function fit(){
  const avail = card.clientWidth - 42;
  s = Math.max(5, Math.min(16, Math.floor(avail/W)));
  sRange.value = s; sBadge.textContent = s + ' px';
}
function layout(){
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*s*dpr; cv.height = H*s*dpr;
  cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r = n>>16&255, g = n>>8&255, b = n&255;
  const t = amt < 0 ? 0 : 255, a = Math.abs(amt);
  r = Math.round(r+(t-r)*a); g = Math.round(g+(t-g)*a); b = Math.round(b+(t-b)*a);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function draw(){
  layout();
  if(mode === 'bead'){
    /* 底板 + 插孔点 */
    ctx.fillStyle = '#efe9dc'; ctx.fillRect(0,0,W*s,H*s);
    ctx.fillStyle = 'rgba(60,40,20,.08)';
    for(let y=0;y<=H;y++) for(let x=0;x<=W;x++) ctx.fillRect(x*s-0.75, y*s-0.75, 1.5, 1.5);
    /* 圆珠 */
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const k = grid[y][x], hex = COLORS[k].hex;
      const dim = sel && sel !== k;
      if(dim) ctx.globalAlpha = 0.12;
      const cx = (x+0.5)*s, cy = (y+0.5)*s, r = s*0.46;
      const g = ctx.createRadialGradient(cx-s*0.15, cy-s*0.2, s*0.08, cx, cy, r);
      g.addColorStop(0, shade(hex, 0.30));
      g.addColorStop(0.62, hex);
      g.addColorStop(1, shade(hex, -0.25));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.18)';           // 中孔
      ctx.beginPath(); ctx.arc(cx, cy, s*0.15, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W*s,H*s);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const k = grid[y][x];
      if(sel && sel !== k) ctx.globalAlpha = 0.12;
      ctx.fillStyle = COLORS[k].hex;
      ctx.fillRect(x*s+0.3, y*s+0.3, s-0.6, s-0.6);
      ctx.globalAlpha = 1;
    }
    if(gridChk.checked){
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for(let x=0;x<=W;x++){ ctx.moveTo(x*s+0.5, 0); ctx.lineTo(x*s+0.5, H*s); }
      for(let y=0;y<=H;y++){ ctx.moveTo(0, y*s+0.5); ctx.lineTo(W*s, y*s+0.5); }
      ctx.stroke();
    }
  }
  if(hover){
    ctx.lineWidth = 2; ctx.strokeStyle = '#222';
    ctx.beginPath(); ctx.arc((hover.x+0.5)*s, (hover.y+0.5)*s, s*0.55, 0, 7); ctx.stroke();
  }
}

/* ================= 交互 ================= */
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  const gx = Math.floor((e.clientX-r.left)/s), gy = Math.floor((e.clientY-r.top)/s);
  if(gx>=0 && gx<W && gy>=0 && gy<H){
    hover = {x:gx, y:gy};
    const k = grid[gy][gx];
    hoverInfo.innerHTML = '列 ' + gx + ' · 行 ' + gy + ' · <b>' + COLORS[k].name + '</b> ' + COLORS[k].hex.toUpperCase();
    tip.style.display = 'block';
    tip.textContent = COLORS[k].name + ' ' + COLORS[k].hex.toUpperCase();
    tip.style.left = Math.min((gx+1)*s + 12, card.clientWidth - 90) + 'px';
    tip.style.top  = Math.max(gy*s - 30, 4) + 'px';
  } else {
    hover = null; tip.style.display = 'none';
  }
  draw();
});
cv.addEventListener('mouseleave', () => {
  hover = null; tip.style.display = 'none';
  hoverInfo.textContent = '移动鼠标查看珠子坐标与颜色';
  draw();
});

/* 配色清单 */
function renderLegend(){
  const counts = {};
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) counts[grid[y][x]] = (counts[grid[y][x]]||0)+1;
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = entries[0][1];
  legend.innerHTML = entries.map(([k,n]) =>
    '<div class="lg'+(sel===k?' on':'')+'" data-k="'+k+'">' +
      '<span class="dot" style="--c:'+COLORS[k].hex+'"></span>' +
      '<span class="nm">'+COLORS[k].name+'</span>' +
      '<span class="bar"><i style="width:'+(n/max*100).toFixed(1)+'%"></i></span>' +
      '<span class="ct"><b>'+n+'</b> 颗</span>' +
    '</div>').join('');
  totalCt.textContent = W*H + ' 颗';
}
legend.addEventListener('click', e => {
  const item = e.target.closest('.lg');
  if(!item) return;
  sel = (sel === item.dataset.k) ? null : item.dataset.k;
  selInfo.innerHTML = sel ? '已高亮：<b>'+COLORS[sel].name+'</b>（再次点击色卡取消）' : '';
  renderLegend(); draw();
});

/* 控件 */
nameIn.addEventListener('input', () => {
  initials = nameIn.value.trim().toUpperCase().slice(0,6);
  buildGrid(); renderLegend(); draw();
});
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  mode = b.dataset.m;
  gridChk.disabled = (mode !== 'pixel');
  draw();
}));
sRange.addEventListener('input', () => {
  manualSize = true;
  s = +sRange.value; sBadge.textContent = s + ' px';
  draw();
});
fitBtn.addEventListener('click', () => { manualSize = false; fit(); draw(); });
window.addEventListener('resize', () => { if(!manualSize) fit(); draw(); });
saveBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = '优秀青年奖状-拼豆图纸.png';
  a.href = cv.toDataURL('image/png');
  a.click();
});

/* ================= 启动 ================= */
buildGrid(); fit(); draw(); renderLegend();
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { buildGrid(); draw(); renderLegend(); });
}
</script>
</body>
</html>
